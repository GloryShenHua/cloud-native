apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-api-healthcheck
  namespace: venue-booking
  labels:
    app: node-api-healthcheck
    app.kubernetes.io/part-of: venue-booking-system
spec:
  selector:
    matchLabels:
      app: node-api-healthcheck
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: node-api-healthcheck
        app.kubernetes.io/part-of: venue-booking-system
    spec:
      terminationGracePeriodSeconds: 5
      # 单节点 kind / 多节点集群的控制平面默认带 NoSchedule 污点；
      # 巡检要求“每个符合条件的节点都运行一个副本”，因此显式容忍控制平面污点。
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: healthcheck
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_HEALTH_URL
              value: "http://api:8080/actuator/health"
            - name: CHECK_INTERVAL_SECONDS
              value: "30"
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "[node=${NODE_NAME}] [pod=${POD_NAME}] healthcheck started; target=${API_HEALTH_URL}"
              while true; do
                ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if wget -q -T 5 -O /dev/null "${API_HEALTH_URL}" 2>/dev/null; then
                  echo "[node=${NODE_NAME}] [pod=${POD_NAME}] ${ts} status=UP"
                else
                  echo "[node=${NODE_NAME}] [pod=${POD_NAME}] ${ts} status=DOWN"
                fi
                sleep "${CHECK_INTERVAL_SECONDS}"
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
